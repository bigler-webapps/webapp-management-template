# Values file — example
#
# Copy this file to secrets.values.yaml (gitignored) and fill in real values.
# Structure: top-level `targets` mapping, one entry per target name in inventory.
#
# Used by `sync-secrets --secret-source yaml --values-file secrets.values.yaml`
# to populate GitHub Environment Secrets.

targets:

  production:
    # --- Server access (Tailscale-SSH keyless; no SSH private keys) ---
    # Shared deploy client (tag:ci-deploy) and dedicated provisioning client
    # (tag:ci-provision), created in the Tailscale admin console.
    TS_OAUTH_CLIENT_ID: "replace-with-deploy-oauth-client-id"
    TS_OAUTH_SECRET: "tskey-client-replace-with-deploy-oauth-secret"
    TS_PROVISION_OAUTH_CLIENT_ID: "replace-with-provision-oauth-client-id"
    TS_PROVISION_OAUTH_SECRET: "tskey-client-replace-with-provision-oauth-secret"

    # --- Backup (Backblaze B2) ---
    RESTIC_REPO_B2: "s3:s3.eu-central-003.backblazeb2.com/your-bucket-name"
    RESTIC_PASSWORD: "generate-with-openssl-rand-hex-32"
    B2_KEY_ID: "K001abc..."
    B2_APP_KEY: "K001def..."

    # --- Traefik / Infrastructure ---
    # Bcrypt hash from `htpasswd -nbB admin <password>`. DOUBLE the $ signs
    # ($$ instead of $) — docker compose collapses them back to $ during
    # variable substitution. After editing this file, SAVE IT (Ctrl+S in
    # VS Code) before running sync-secrets.
    TRAEFIK_DASHBOARD_AUTH: 'admin:$$2y$$05$$YourBcryptHashHere'
    ACME_EMAIL: "you@example.com"
    DOMAIN_TRAEFIK: "traefik.example.com"
    DOMAIN_KUMA: "kuma.example.com"

  # --- Optional second target ---
  # staging:
  #   TS_OAUTH_CLIENT_ID: "..."
  #   ...
