name: Terraform Plan

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-*.yml'

  # Manual plan preview. If your estate has no feature/develop branch (a
  # single-`main` model — see the branching section of this repo's CLAUDE.md),
  # the pull_request trigger above is unreachable for previewing an unmerged
  # change. This dispatch is how you preview it instead: push the candidate
  # commit to a short-lived, non-`main` ref and run this workflow against that
  # ref. Read-only: the shared action's PR-comment step is guarded by
  # `github.event_name == 'pull_request'`, so a dispatch run plans and writes
  # the output to the job log only. A plan cannot mutate infra.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # für PR-Comment mit Plan-Output

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: main-prod
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: YOUR_GITHUB_ORG/workflow-templates/.github/actions/terraform-plan@v2.0.3
        with:
          tf_cloud_token: ${{ secrets.TF_CLOUD_TOKEN }}
          cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare_access_api_token: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
