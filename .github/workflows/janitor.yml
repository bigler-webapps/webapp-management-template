name: Janitor

# Lightweight cleanup and diagnostics: Docker prune, log cleanup, disk usage
# report. A box that rebuilds Docker images on every push can fill its disk
# well within a month — size the cadence to your own build cache growth rate;
# daily is a safer starting default than monthly for an actively-deploying app.

on:
  schedule:
    - cron: "40 3 * * *"  # daily, 03:40 UTC — one hour before a typical Sunday reboot-maintenance window, so a box is never rebooted while sitting on a full disk
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment from inventory.yaml"
        required: true
        type: environment

jobs:
  janitor:
    # Skip on the template repo itself; tenant forks run normally.
    if: github.repository != 'bigler-webapps/webapp-management-template'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'production' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Checkout webapp-ops-scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: bigler-webapps/webapp-ops-scripts
          path: ops-scripts

      - name: Run janitor
        uses: bigler-webapps/workflow-templates/.github/actions/janitor@v2.0.3
        with:
          target: ${{ inputs.target || 'production' }}
          ssh_host: ${{ secrets.SSH_HOST }}
          ssh_user: ${{ secrets.SSH_USER }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
