name: Janitor

# Monthly lightweight cleanup and diagnostics:
# Docker prune, log cleanup, disk usage report.

on:
  schedule:
    - cron: "40 3 7 * *"  # 7th of month, 03:40 UTC
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment from inventory.yaml"
        required: true
        type: environment

jobs:
  janitor:
    # Skip on the template repo itself; tenant forks run normally.
    if: github.repository != 'bigler-webapps/webapp-management-template'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'production' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout webapp-ops-scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: bigler-webapps/webapp-ops-scripts
          path: ops-scripts

      - name: Run janitor
        uses: bigler-webapps/workflow-templates/.github/actions/janitor@v2.13.1
        with:
          target: ${{ inputs.target || 'production' }}
          # TODO: tenant-specific - replace your-tailnet-domain with your tailnet's MagicDNS name
          ssh_host: ${{ inputs.target || 'production' }}.your-tailnet-domain
          ssh_user: deploy
          ts_oauth_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts_oauth_secret: ${{ secrets.TS_OAUTH_SECRET }}
