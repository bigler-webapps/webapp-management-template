name: Restore

# Restore an app DB from a restic snapshot.
# Production restore is a destructive operation - protect via GitHub Environment "production-destructive"
# with Required Reviewers.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment from inventory.yaml"
        required: true
        type: environment
      app_name:
        description: "App identifier"
        required: true
        type: string
      target_env:
        description: "Where the data should go"
        required: true
        type: choice
        default: "staging"
        options:
          - staging
          - zip-file
          - production
      snapshot_id:
        description: "Restic snapshot id (or 'latest')"
        required: true
        type: string
        default: "latest"
      confirm_destroy:
        description: "Type DESTROY to confirm production restore (ignored for non-prod)"
        required: false
        type: string

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm production restore
        if: ${{ inputs.target_env == 'production' }}
        run: |
          if [ "${{ inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "Production restore requires confirm_destroy=DESTROY"
            exit 1
          fi

  restore:
    needs: preflight
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env == 'production' && 'production-destructive' || inputs.target }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout webapp-ops-scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: bigler-webapps/webapp-ops-scripts
          path: ops-scripts

      - name: Run restore
        uses: bigler-webapps/workflow-templates/.github/actions/restore@v2.13.0
        with:
          target: ${{ inputs.target }}
          app_name: ${{ inputs.app_name }}
          target_env: ${{ inputs.target_env }}
          snapshot_id: ${{ inputs.snapshot_id }}
          # TODO: tenant-specific - replace your-tailnet-domain with your tailnet's MagicDNS name
          ssh_host: ${{ inputs.target || 'production' }}.your-tailnet-domain
          ssh_user: deploy
          restic_repo_b2: ${{ secrets.RESTIC_REPO_B2 }}
          restic_password: ${{ secrets.RESTIC_PASSWORD }}
          b2_key_id: ${{ secrets.B2_KEY_ID }}
          b2_app_key: ${{ secrets.B2_APP_KEY }}
          ts_oauth_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts_oauth_secret: ${{ secrets.TS_OAUTH_SECRET }}
