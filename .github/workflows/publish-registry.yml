name: Publish App Registry

# Producer side of the project.yaml-derived app registry. Runs the resolver
# org-wide and publishes registry.json as a build ARTIFACT (not a commit — so it
# never triggers deploy-traefik). Consumers (e.g. cockpit's sync_status_entities)
# download the latest artifact via the GitHub API using their existing
# actions:read token — no cross-repo Contents access needed on their side.
#
# registry.json shape: {"servers": {<srv>: {deployed_apps, sync_apps, domains}},
#                       "apps": [{repo, project_name, server, domains, staging_sync, use_traefik}]}

on:
  schedule:
    - cron: '45 3 * * *'  # daily 03:45 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Generate GitHub App token (cross-repo contents:read)
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2
        with:
          app-id: ${{ secrets.KUMA_SYNC_APP_ID }}
          private-key: ${{ secrets.KUMA_SYNC_APP_PRIVATE_KEY }}
          owner: YOUR_GITHUB_ORG

      - name: Derive registry from project.yaml (org-wide)
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # Fail-closed: --min-apps aborts on a narrowed App install / API error
          # so we never publish a silently shrunk registry.
          python3 .github/scripts/resolve_app_inventory.py --github-app --min-apps 10 > registry.json
          echo "Published registry:"
          python3 -m json.tool registry.json

      - name: Upload registry artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4
        with:
          name: app-registry
          path: registry.json
          retention-days: 90
          if-no-files-found: error
