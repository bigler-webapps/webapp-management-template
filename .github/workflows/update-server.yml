name: Update Server

# DEPRECATED 2026-05-24 — use `ansible-provision.yml` instead.
#
# `ansible/site.yml` is idempotent — running it against an existing host is
# the canonical "update" path. This legacy workflow is kept only for repos
# that have not yet adopted the Ansible role-set.
#
# Incremental, idempotent re-apply of server tuning and base tooling on an
# already-provisioned host. Safe to run on production — does NOT touch UFW,
# fail2ban core config, Docker, sudoers, or users.
#
# Use this whenever a new sysctl tuning or base package needs to land on an
# existing server, without rerunning the heavy provision-server workflow.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment from inventory.yaml"
        required: true
        type: environment
      server_ip:
        description: "Optional host override (uses SSH_HOST secret if empty)"
        required: false
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0

      - name: Apply incremental server updates
        uses: bigler-webapps/workflow-templates/.github/actions/update-server@v2.13.0
        with:
          target: ${{ inputs.target }}
          target_host: ${{ inputs.server_ip }}
          ssh_host: ${{ secrets.SSH_HOST }}
          ssh_private_key_root: ${{ secrets.SSH_PRIVATE_KEY_ROOT }}
