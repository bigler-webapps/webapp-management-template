name: Origin-Cert Coverage

# Drift report: verifies every PROXIED app domain (project.yaml production
# `use_traefik: true`) is covered by a configured Cloudflare Origin Certificate
# (or an allowlisted Universal-SSL zone). Catches a new app/domain whose zone
# has no origin cert before it becomes a TLS gap in production.
#
# webapp-management cannot block app-repo PRs (different repos), so this runs on
# a schedule as a drift alert + can be dispatched on demand. A failing run means
# a proxied zone is missing its origin cert — create it (CF Dashboard -> Proton
# -> secrets.yaml + deploy-traefik write_cert + dynamic/origin-certs.yml) or, if
# the zone intentionally uses Universal SSL (or is an external domain we don't
# manage TLS for), list it in project.yaml infra.tls_exempt_zones.

on:
  schedule:
    - cron: '15 4 * * *'  # daily 04:15 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # Cross-repo contents:read so the check can read every app repo's
      # project.yaml — same org GitHub App kuma-sync uses.
      - name: Generate GitHub App token (cross-repo contents:read)
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2
        with:
          app-id: ${{ secrets.KUMA_SYNC_APP_ID }}
          private-key: ${{ secrets.KUMA_SYNC_APP_PRIVATE_KEY }}
          owner: YOUR_GITHUB_ORG

      - name: Check origin-cert coverage
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/check_origin_cert_coverage.py --github-app --min-apps 10
