name: Maintenance

# Weekly OS maintenance: apt updates, reboot if needed, container health check.

on:
  schedule:
    - cron: "30 3 * * 0"  # Sunday 03:30 UTC
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment from inventory.yaml"
        required: true
        type: environment
      apply_updates:
        description: "Install apt updates before reboot decision"
        required: false
        type: boolean
        default: true
      force_reboot:
        description: "Force reboot even if /var/run/reboot-required is absent"
        required: false
        type: boolean
        default: false

jobs:
  maintenance:
    # Skip on the template repo itself; tenant forks run normally.
    if: github.repository != 'bigler-webapps/webapp-management-template'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'production' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run maintenance
        uses: bigler-webapps/workflow-templates/.github/actions/maintenance@v2.13.1
        with:
          target: ${{ inputs.target || 'production' }}
          # TODO: tenant-specific - replace your-tailnet-domain with your tailnet's MagicDNS name
          ssh_host: ${{ inputs.target || 'production' }}.your-tailnet-domain
          ssh_user: deploy
          ts_oauth_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts_oauth_secret: ${{ secrets.TS_OAUTH_SECRET }}
          apply_updates: ${{ inputs.apply_updates || true }}
          force_reboot: ${{ inputs.force_reboot || false }}
          # TODO: tenant-specific - adapt to your container names
          expected_container_tokens_json: '["traefik"]'
