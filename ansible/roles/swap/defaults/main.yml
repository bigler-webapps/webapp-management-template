---
# Swap-file configuration. Override per-host in host_vars/<host>.yml if a
# host needs different sizing (e.g. a beefy prod host has more RAM and can run
# without swap, while staging is small and needs headroom for build phases).
swap_enabled: true
swap_path: /swapfile
swap_size_mb: 4096
swap_swappiness: 10              # Prefer RAM; only spill to swap under real pressure
swap_vfs_cache_pressure: 50      # Less aggressive cache eviction (default 100)
