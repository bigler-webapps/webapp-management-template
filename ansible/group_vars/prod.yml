---
# Tailscale config for prod hosts.
#
# Auth-key comes from the GitHub Environment Secret TAILSCALE_AUTH_KEY
# of the active target (e.g. `innoservice-prod`) — sync-secrets pushes
# it from Proton, the workflow exposes it as env var, this lookup
# reads it on the controller.
tailscale_authkey: "{{ lookup('env', 'TAILSCALE_AUTH_KEY') }}"

# Tag the host announces in the tailnet. Must be declared in the
# tailnet ACL `tagOwners`, and the auth-key must be generated
# pre-authorized for the same tag.
#
# OPERATOR NOTE: tag changes require `tailscale_force_up: true` for
# one playbook run (the role skips `up` on already-running hosts).
tailscale_advertise_tags:
  - tag:server-prod

# Override the role default (port 22 only). prod hosts run the web stack
# (Traefik) and need 80/443 reachable for direct-A app subdomains and any
# legacy non-Tunnel paths. Tightening to tailscale0-only is a follow-up
# after the per-tenant ≥7-day Tailscale-SSH soak — see
# bigler-webapps/webapp-template/TENANT_ONBOARDING_GUIDE.md Section 10.
ufw_allow_in:
  - port: "22"
    proto: tcp
    comment: ssh
  - port: "80"
    proto: tcp
    comment: http
  - port: "443"
    proto: tcp
    comment: https
  - from: "100.64.0.0/10"
    port: "9110"
    proto: tcp
    comment: "server-health responder — tailnet only, polled by the monitor"
  # Same-host containers reach :9110 from a Docker bridge subnet, not from the
  # tailnet, so the rule above never matches them and default-deny drops the
  # packet. Ranges, not subnets — Docker allocates per compose project and
  # renumbers on recreate. Off-host reachability is NOT prevented by this rule
  # (UFW matches on source IP only, no interface constraint) but by the
  # topology around it: verify these ranges carry only Docker bridges on this
  # host before adding one with provider private networking in the same CIDRs,
  # and note RFC1918 sources are not internet-routable / dropped at the
  # provider edge regardless. The responder also still binds ONLY to the
  # tailnet address, which is the real second line of defence.
  - from: "172.16.0.0/12"
    port: "9110"
    proto: tcp
    comment: "server-health responder -- Docker bridge range, same-host containers"
  - from: "192.168.0.0/16"
    port: "9110"
    proto: tcp
    comment: "server-health responder -- Docker bridge range, same-host containers"
