[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = ./collections
retry_files_enabled = False
host_key_checking = False
forks = 5
nocows = True
stdout_callback = default

[ssh_connection]
# `retries` and the ServerAlive* options are DEFENCE IN DEPTH, not a fix for a
# root-caused failure mode: if a play upgrades the `tailscale` package itself,
# its postinst restarts the tailscaled that SERVES the current SSH session, and
# no keepalive saves a session whose server process has already exited (that
# needs a transient apt hold in the base role instead). What these options DO
# buy: a transport drop from any OTHER cause (tailnet blip, DERP path change)
# is retried instead of failing the host outright, and a dead peer is detected
# in ~60s (15s x 4) instead of hanging on the TCP default.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=4
retries = 3
pipelining = True
